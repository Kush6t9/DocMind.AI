version: "3.8"

services:
  docmind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docmind_ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - doc_network

networks:
  doc_network:
    driver: bridge
